function commit(){let {type,id}=editTarget,form=document.getElementById('editForm'),data=Object.fromEntries(new FormData(form));for(let k in data)data[k]=String(data[k]).trim();if(type==='event'&&!data.title)return;let arr=type==='event'?db.events:type==='session'?db.sessions:type==='course'?db.courses:null;if(type==='week'){Object.assign(db.weeks[currentWeek-1],data)}else if(type==='goal'){if(id==null){db.weeks[currentWeek-1].goals.push(data.title);db.weeks[currentWeek-1].goalDone.push(false)}else db.weeks[currentWeek-1].goals[Number(id)]=data.title}else if(id){Object.assign(arr.find(v=>v.id===id),data)}else{let obj={...data,id:'custom-'+Date.now()+'-'+Math.floor(Math.random()*1000)};if(type==='event'||type==='session')obj.done=false;arr.push(obj)}save()}

function action(a){if(a==='week'){page='weekly'}else if(a==='calendar'){page='calendar'}else if(a==='prev')currentWeek=Math.max(1,currentWeek-1);else if(a==='next')currentWeek=Math.min(11,currentWeek+1);else if(a==='monthprev')month=new Date(month.getFullYear(),month.getMonth()-1,1);else if(a==='monthnext')month=new Date(month.getFullYear(),month.getMonth()+1,1);else if(a==='editweek')openEditor('week',currentWeek);else if(a==='addgoal')openEditor('goal');else if(a==='addsession')openEditor('session');else if(a==='addevent')openEditor('event');else if(a==='addcourse')openEditor('course');else if(a==='savereflection'){db.weeks[currentWeek-1].reflection=document.getElementById('reflection').value;save()}else if(a==='export')download();else if(a==='import')document.getElementById('importFile').click();else if(a==='reset'){if(confirm('למחוק את כל השינויים ולהחזיר את התוכנית המקורית?')){db=structuredClone(original);save()}}else if(a.startsWith('edit-event-'))openEditor('event',a.slice(11));render()}
document.addEventListener('click',e=>{const p=e.target.closest('[data-page]'),w=e.target.closest('[data-week]'),ed=e.target.closest('[data-edit]'),act=e.target.closest('[data-action]'),filter=e.target.closest('[data-filter]'),eg=e.target.closest('[data-editgoal]'),dg=e.target.closest('[data-deletegoal]');if(p){page=p.dataset.page;render()}else if(w){currentWeek=Number(w.dataset.week);page='weekly';render()}else if(ed){let [type,...ids]=ed.dataset.edit.split(':');openEditor(type,ids.join(':'))}else if(act)action(act.dataset.action);else if(filter){eventFilter=filter.dataset.filter;render()}else if(eg)openEditor('goal',eg.dataset.editgoal);else if(dg){let i=Number(dg.dataset.deletegoal);if(confirm('למחוק מטרה זו?')){db.weeks[currentWeek-1].goals.splice(i,1);db.weeks[currentWeek-1].goalDone.splice(i,1);save()}}});document.addEventListener('change',e=>{if(e.target.dataset.goal){let [w,i]=e.target.dataset.goal.split(':').map(Number);db.weeks[w].goalDone[i]=e.target.checked;save()}else if(e.target.dataset.session){let s=db.sessions.find(x=>x.id===e.target.dataset.session);if(s){s.done=e.target.checked;save()}}else if(e.target.dataset.eventdone){db.events.find(x=>x.id===e.target.dataset.eventdone).done=e.target.checked;save()}});document.getElementById('editForm').addEventListener('submit',e=>{e.preventDefault();commit();document.getElementById('editor').close()});document.getElementById('cancel').onclick=()=>document.getElementById('editor').close();document.getElementById('deleteItem').onclick=del;document.getElementById('exportBtn').onclick=download;document.getElementById('importBtn').onclick=()=>document.getElementById('importFile').click();document.getElementById('addBtn').onclick=()=>openEditor(page==='courses'?'course':page==='weekly'?'session':'event');document.getElementById('importFile').addEventListener('change',async e=>{let f=e.target.files[0];if(!f)return;try{let v=JSON.parse(await f.text());if(!Array.isArray(v.weeks)||!Array.isArray(v.courses)||!Array.isArray(v.events)||!Array.isArray(v.sessions))throw Error();if(confirm('לשחזר את הגיבוי? הפעולה תחליף את המידע הקיים.')){db=v;save()}}catch(err){alert('קובץ הגיבוי אינו תקין.')}e.target.value=''});render();
</script></body></html>
